name: OpenTofu

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main

jobs:
  tofu:
    name: fmt, validate, test
    runs-on: ubuntu-latest
    steps:
      # check-moved-blocks.py diffs against main, so it needs the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - run: tofu fmt -check -recursive -diff

      - run: tofu init -backend=false -input=false

      - run: tofu validate

      # The suite mocks both providers, so it needs no AWS or Datadog credentials.
      - run: tofu test

      # State moves only manifest against real prior state, so tofu test cannot
      # reach them.
      - run: python3 scripts/check-moved-blocks.py

  examples:
    name: validate examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [minimal, sns-delivery, complete, glue-only]
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - run: tofu init -backend=false -input=false
        working-directory: examples/${{ matrix.example }}

      - run: tofu validate
        working-directory: examples/${{ matrix.example }}

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-tflint@v1.25.0
        with:
          github_token: ${{ secrets.github_token }}
