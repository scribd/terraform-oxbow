name: OpenTofu

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main

jobs:
  tofu:
    name: fmt, validate, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - run: tofu fmt -check -recursive -diff

      - run: tofu init -backend=false -input=false

      - run: tofu validate

      # The suite mocks both providers, so it needs no AWS or Datadog credentials.
      - run: tofu test

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-tflint@v1.25.0
        with:
          github_token: ${{ secrets.github_token }}
